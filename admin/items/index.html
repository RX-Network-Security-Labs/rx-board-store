<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>All Items — Admin — RX Board Store</title>
  <link rel="stylesheet" href="../../assets/css/style.css"/>
</head>
<body>
<nav><div class="nav-inner">
  <a href="/rx-board-store/" class="nav-logo">RX<em>Board</em> Store</a>
  <div class="nav-auth" id="nav-auth"></div>
</div></nav>
<div class="container">
  <div class="admin-layout">
    <div id="admin-sidebar-slot"></div>
    <div id="admin-content"><div class="loading"><div class="spinner"></div>Loading...</div></div>
  </div>
</div>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../assets/js/supabase.js"></script>
<script>
async function loadItems(){
  const user=await getUser();
  if(!user){
    document.body.innerHTML='<div style="min-height:60vh;display:flex;align-items:center;justify-content:center;padding:40px;text-align:center"><div><span class="material-icons-round" style="font-size:48px;color:var(--text-muted)">lock</span><h2 style="margin:16px 0 8px">Admin Access Required</h2><p style="color:var(--text-secondary);margin-bottom:20px">Please sign in with an admin account.</p><a href="/rx-board-store/auth/" class="btn btn-primary">Sign In</a></div></div>';
    return;
  }
  if(!await isAdmin(user.id)){
    document.body.innerHTML='<div style="min-height:60vh;display:flex;align-items:center;justify-content:center;padding:40px;text-align:center"><div><span class="material-icons-round" style="font-size:48px;color:var(--text-muted)">admin_panel_settings</span><h2 style="margin:16px 0 8px">Not an Admin</h2><p style="color:var(--text-secondary);margin-bottom:20px">Your account does not have admin privileges.</p><a href="/rx-board-store/" class="btn btn-outline">Back to Store</a></div></div>';
    return;
  }
  const {data:items}=await sb.from('items').select('*,developers(display_name)').order('created_at',{ascending:false});
  const _slot = document.getElementById('admin-sidebar-slot');
  if (_slot) _slot.innerHTML = renderAdminSidebar('items', 0);
  document.getElementById('admin-content').innerHTML=`
    <div class="section-card">
      <div class="section-card-header">
        <h2><span class="material-icons-round">inventory_2</span>All Items</h2>
        <span style="font-size:12px;color:var(--text-muted);font-family:'JetBrains Mono',monospace">${(items||[]).length} total</span>
      </div>
      ${items?.length?items.map(item=>{
        const tag=getTypeTag(item.type);
        const sc=item.status==='approved'?'tag-approved':item.status==='rejected'?'tag-rejected':'tag-pending';
        const iconUrl=getItemIconUrl(item);
        return `<div class="sub-row">
          <div class="sub-icon">${iconUrl?`<img src="${iconUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:8px" onerror="this.parentElement.innerHTML='<span class=\\'material-icons-round\\'>${tag.icon}</span>'">`:`<span class="material-icons-round">${tag.icon}</span>`}</div>
          <div class="sub-info">
            <h4>${item.name} <span class="tag ${sc}" style="vertical-align:middle">${item.status}</span></h4>
            <p>by ${item.developers?.display_name||'?'} · v${item.version} · ${item.downloads} downloads</p>
          </div>
          <div class="sub-actions">
            <a href="/rx-board-store/item/?id=${item.id}" target="_blank" class="btn btn-sm btn-outline"><span class="material-icons-round">visibility</span>View</a>
            ${item.status==='approved'?`<button class="btn btn-sm btn-danger" onclick="removeItem('${item.id}')"><span class="material-icons-round">delete</span>Remove</button>`:''}
          </div>
        </div>`;
      }).join(''):'<div class="empty"><span class="material-icons-round">inbox</span><h3>No items yet</h3></div>'}
    </div>`;
}
async function removeItem(id){
  if(!confirm('Remove this item from the store?'))return;
  await sb.from('items').update({status:'rejected'}).eq('id',id);
  loadItems();
}
document.addEventListener('DOMContentLoaded',loadItems);
</script>
</body></html>
