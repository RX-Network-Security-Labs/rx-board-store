<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Admin — RX Board Store</title>
  <link rel="stylesheet" href="../assets/css/style.css"/>
  <style>
    .verify-wrap{min-height:calc(100vh - 60px);display:flex;align-items:center;justify-content:center;padding:40px 24px;}
    .verify-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:36px;width:100%;max-width:400px;text-align:center;}
    .verify-icon{width:64px;height:64px;border-radius:50%;background:var(--teal-light);color:var(--teal);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;}
    .verify-icon .material-icons-round{font-size:32px;}
    .verify-card h2{font-size:20px;font-weight:700;margin-bottom:8px;}
    .verify-card p{font-size:13px;color:var(--text-secondary);margin-bottom:24px;line-height:1.6;}
    .code-input{display:flex;gap:8px;justify-content:center;margin-bottom:20px;}
    .code-input input{width:44px;height:52px;text-align:center;font-size:20px;font-weight:700;font-family:'JetBrains Mono',monospace;border:2px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text-primary);transition:border-color 0.15s;}
    .code-input input:focus{outline:none;border-color:var(--teal);}
    .stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
    .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
    .stat-card strong{display:block;font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--text-primary);margin-bottom:2px;}
    .stat-card span{font-size:12px;color:var(--text-muted);}
    @media(max-width:900px){.stat-cards{grid-template-columns:repeat(2,1fr);}}
  </style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="/rx-board-store/" class="nav-logo">RX<em>Board</em> Store</a>
    <ul class="nav-links"><li><a href="/rx-board-store/"><span class="material-icons-round">home</span>Home</a></li></ul>
    <div class="nav-auth" id="nav-auth"></div>
  </div>
</nav>

<div id="main-content">
  <div class="loading"><div class="spinner"></div></div>
</div>

<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase.js"></script>
<script>
async function init() {
  const user = await getUser();
  if (!user) {
    document.getElementById('main-content').innerHTML = `
      <div class="verify-wrap">
        <div class="verify-card">
          <div class="verify-icon"><span class="material-icons-round">lock</span></div>
          <h2>Admin Access Required</h2>
          <p>You need to be signed in with an admin account to access this panel.</p>
          <a href="/rx-board-store/auth/" class="btn btn-primary btn-full" style="margin-top:16px">
            <span class="material-icons-round">login</span>Sign In
          </a>
        </div>
      </div>`;
    return;
  }

  const admin = await isAdmin(user.id);
  if (!admin) {
    document.getElementById('main-content').innerHTML = `
      <div class="verify-wrap">
        <div class="verify-card">
          <div class="verify-icon"><span class="material-icons-round">admin_panel_settings</span></div>
          <h2>Not an Admin</h2>
          <p>Your account does not have admin privileges. If you believe this is a mistake, contact the project owner.</p>
          <a href="/rx-board-store/" class="btn btn-outline btn-full" style="margin-top:16px">
            <span class="material-icons-round">home</span>Back to Store
          </a>
        </div>
      </div>`;
    return;
  }

  // Check if device is already verified
  if (isAdminVerifiedOnDevice()) {
    renderAdminPanel(user);
  } else {
    renderVerifyScreen(user);
  }
}

async function renderVerifyScreen(user) {
  // Send code via Telegram
  await sendAdminVerificationCode();

  document.getElementById('main-content').innerHTML = `
    <div class="verify-wrap">
      <div class="verify-card">
        <div class="verify-icon">
          <span class="material-icons-round">security</span>
        </div>
        <h2>New Device Detected</h2>
        <p>A 6-digit verification code has been sent to your Telegram. Enter it below to verify this device.</p>
        <div id="verify-alert"></div>
        <div class="code-input">
          <input type="text" maxlength="1" id="c1" oninput="moveNext(this,'c2')" onkeydown="movePrev(event,'c1')"/>
          <input type="text" maxlength="1" id="c2" oninput="moveNext(this,'c3')" onkeydown="movePrev(event,'c1')"/>
          <input type="text" maxlength="1" id="c3" oninput="moveNext(this,'c4')" onkeydown="movePrev(event,'c2')"/>
          <input type="text" maxlength="1" id="c4" oninput="moveNext(this,'c5')" onkeydown="movePrev(event,'c3')"/>
          <input type="text" maxlength="1" id="c5" oninput="moveNext(this,'c6')" onkeydown="movePrev(event,'c4')"/>
          <input type="text" maxlength="1" id="c6" oninput="moveNext(this,null)" onkeydown="movePrev(event,'c5')"/>
        </div>
        <button class="btn btn-primary btn-full" onclick="checkCode()">
          <span class="material-icons-round">verified_user</span>Verify Device
        </button>
        <p style="margin-top:14px;font-size:12px;color:var(--text-muted)">
          Didn't receive it?
          <a href="#" onclick="resendCode()" style="color:var(--teal)">Resend code</a>
        </p>
      </div>
    </div>`;
  document.getElementById('c1').focus();
}

function moveNext(el, nextId) {
  if (el.value.length === 1 && nextId) document.getElementById(nextId)?.focus();
}
function movePrev(e, prevId) {
  if (e.key === 'Backspace' && e.target.value === '') document.getElementById(prevId)?.focus();
}

async function resendCode() {
  await sendAdminVerificationCode();
  document.getElementById('verify-alert').innerHTML = `
    <div class="alert alert-info"><span class="material-icons-round">send</span>New code sent to Telegram!</div>`;
}

function checkCode() {
  const code = ['c1','c2','c3','c4','c5','c6'].map(id => document.getElementById(id).value).join('');
  if (code.length < 6) {
    document.getElementById('verify-alert').innerHTML = `
      <div class="alert alert-error"><span class="material-icons-round">error</span>Please enter all 6 digits!</div>`;
    return;
  }
  if (verifyAdminCode(code)) {
    setAdminVerifiedOnDevice();
    document.getElementById('verify-alert').innerHTML = `
      <div class="alert alert-success"><span class="material-icons-round">check_circle</span>Device verified! Loading admin panel...</div>`;
    setTimeout(() => location.reload(), 1200);
  } else {
    document.getElementById('verify-alert').innerHTML = `
      <div class="alert alert-error"><span class="material-icons-round">error</span>Wrong code! Try again.</div>`;
  }
}

async function renderAdminPanel(user) {
  const { data: items } = await sb.from('items').select('status, downloads, type');
  const { data: devs } = await sb.from('developers').select('id');
  const { data: pending } = await sb.from('submissions')
    .select('*, items(name,type,icon_ext,version,extension), developers(display_name,username)')
    .eq('status','pending')
    .order('submitted_at', { ascending: false });

  const approved = (items||[]).filter(i => i.status==='approved').length;
  const pendingCount = (items||[]).filter(i => i.status==='pending').length;
  const totalDownloads = (items||[]).reduce((s,i) => s+(i.downloads||0), 0);

  document.getElementById('main-content').innerHTML = `
    <div class="container">
      <div class="admin-layout">
${renderAdminSidebar("overview", pendingCount)}
        <div>
          <div class="stat-cards">
            <div class="stat-card"><strong>${approved}</strong><span>Published Items</span></div>
            <div class="stat-card"><strong style="color:var(--yellow)">${pendingCount}</strong><span>Pending Review</span></div>
            <div class="stat-card"><strong>${(devs||[]).length}</strong><span>Developers</span></div>
            <div class="stat-card"><strong>${totalDownloads}</strong><span>Total Downloads</span></div>
          </div>

          <div class="section-card">
            <div class="section-card-header">
              <h2><span class="material-icons-round">pending_actions</span>Pending Submissions</h2>
              <a href="/rx-board-store/admin/submissions/" class="btn btn-sm btn-outline">View All</a>
            </div>
            ${pending?.length ? pending.slice(0,5).map(s => {
              const tag = getTypeTag(s.items?.type||'plugin');
              const iconUrl = s.items ? getItemIconUrl({...s.items, id: s.item_id}) : null;
              return `
                <div class="sub-row">
                  <div class="sub-icon">
                    ${iconUrl
                      ? `<img src="${iconUrl}" onerror="this.parentElement.innerHTML='<span class=\\'material-icons-round\\'>${tag.icon}</span>'">`
                      : `<span class="material-icons-round">${tag.icon}</span>`}
                  </div>
                  <div class="sub-info">
                    <h4>${s.items?.name||'Unknown'}</h4>
                    <p>by @${s.developers?.username||'?'} · ${s.items?.extension||''} · ${new Date(s.submitted_at).toLocaleDateString()}</p>
                  </div>
                  <div class="sub-actions">
                    <button class="btn btn-sm btn-success" onclick="reviewItem('${s.id}','${s.item_id}','approved')">
                      <span class="material-icons-round">check</span>Approve
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="reviewItem('${s.id}','${s.item_id}','rejected')">
                      <span class="material-icons-round">close</span>Reject
                    </button>
                  </div>
                </div>`;
            }).join('') : '<div class="empty"><span class="material-icons-round">check_circle</span><h3>All clear!</h3><p>No pending submissions.</p></div>'}
          </div>
        </div>
      </div>
    </div>`;
}

async function reviewItem(subId, itemId, decision) {
  const reason = decision === 'rejected' ? prompt('Rejection reason (optional):') : null;

  // Update DB first
  await sb.from('submissions').update({ status: decision, rejection_reason: reason||null, reviewed_at: new Date().toISOString() }).eq('id', subId);
  await sb.from('items').update({ status: decision, rejection_reason: reason||null }).eq('id', itemId);

  if (decision === 'approved') {
    try {
      // Get item info for the move
      const { data: item } = await sb.from('items').select('name, type').eq('id', itemId).single();
      const { data: { session } } = await sb.auth.getSession();
      const token = session?.access_token;
      if (!token) throw new Error('Not logged in');

      const res = await fetch(EDGE_FUNCTION_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({
          type: 'approve_item',
          itemId,
          itemType: item?.type || 'plugin',
          itemName: item?.name || itemId
        })
      });
      const result = await res.json();
      if (!res.ok) throw new Error(result.error || 'Move failed');

      if (result.warning) {
        alert('Item approved! ✅\n\n' + result.warning);
      } else {
        alert('Item approved & files moved automatically! ✅\n\nFiles moved: ' + (result.moved || []).join(', '));
      }
    } catch (e) {
      console.error(e);
      alert('Item approved in database ✅\n\nBut automatic file move failed: ' + e.message + '\n\nPlease move the files manually from queue/ to the live folder.');
    }
  } else {
    alert('Item rejected.');
  }
  location.reload();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
